# Build the static export and publish it to GitHub Pages on every push to main.
# Enable Pages once in the repo settings: Settings -> Pages -> Source: GitHub Actions.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Turns Pages on for the repo the first time this runs (Source: GitHub
      # Actions), so no settings click is needed to go live.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Project page: https://<owner>.github.io/TCG-PlayMap/
          NEXT_PUBLIC_BASE_PATH: /TCG-PlayMap
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
